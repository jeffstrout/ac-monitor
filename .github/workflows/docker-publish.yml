name: Publish Docker image

# Auto-update pipeline (mirrors jeffstrout/split-flap).
#
# On every push to main (i.e. after a PR merges), build a multi-arch image and
# push it to GHCR as ghcr.io/<owner>/ac-monitor:latest. A Raspberry Pi running
# deploy/docker-compose.yml pulls that image and auto-updates via Watchtower —
# it never builds from source (the Pi 3B+ is too small to build under QEMU).
#
# NOTE: the build is GUARDED — it is skipped until the `ac_monitor/` Python
# package exists (Phase 2). Until then this workflow stays green without
# producing an image, so the deploy scaffolding can live in the repo now.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

# A newer push to main supersedes an in-flight build.
concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Only build once there is application code to build.
  guard:
    runs-on: ubuntu-latest
    outputs:
      has_app: ${{ steps.check.outputs.has_app }}
    steps:
      - uses: actions/checkout@v4
      - id: check
        run: |
          if [ -f ac_monitor/__main__.py ]; then
            echo "has_app=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_app=false" >> "$GITHUB_OUTPUT"
            echo "::notice::ac_monitor/ package not present yet — skipping image build (Phase 2)."
          fi

  build-and-push:
    needs: guard
    if: needs.guard.outputs.has_app == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # push to GHCR with the built-in GITHUB_TOKEN
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU (arm64 emulation)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build timestamp
        id: vars
        run: echo "build_time=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Image metadata (tags + labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-,format=short

      - name: Build and push (linux/amd64, linux/arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GIT_SHA=${{ github.sha }}
            BUILD_TIME=${{ steps.vars.outputs.build_time }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
