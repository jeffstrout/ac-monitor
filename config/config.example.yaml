# AC Monitor — example configuration
# Copy to config.yaml and fill in the real DS18B20 ROM ids and MQTT credentials.
# This file documents the intended config schema; the loader/validator is Phase 2.

units:
  temperature: F          # C or F

poll:
  interval_s: 5           # how often to read all sensors
  sail_debounce_s: 3      # ignore airflow changes shorter than this

sensors:
  # Map each DS18B20's unique ROM id (from /sys/bus/w1/devices/28-*) to a role.
  onewire:
    suction_line: "28-000000000000"   # refrigerant suction line
    liquid_line:  "28-000000000001"   # refrigerant liquid line
    input_air:    "28-000000000002"   # return air entering the coil
    output_air:   "28-000000000003"   # supply air leaving the coil

  # Setra Model 265 differential pressure transmitter (0-2" W.C., 4-20 mA output),
  # 2-wire loop powered from 24 VDC; a 150 ohm sense resistor across AD1->GND
  # converts the loop current to a voltage the HAT analog input reads.
  pressure:
    hat_stack_level: 0
    adc_channel: 1          # HAT analog input AD1
    range_inh2o: 2.0        # sensor full-scale (unidirectional)
    # Two-point linear map of measured ADC volts -> inH2O (refine with a manometer).
    # Defaults reflect a 150 ohm sense resistor + the input's 15k pull-up to 3.3V:
    #   4 mA  (0" W.C.)  -> ~0.63 V ;  20 mA (full scale) -> ~3.00 V
    calibration:
      volts_at_zero: 0.63   # ADC volts at 0" W.C. (4 mA)
      volts_at_full: 3.00   # ADC volts at range_inh2o (20 mA)
    invert: false           # true if tubing polarity reads a loaded filter as negative

  # HAT opto-isolated digital inputs (Sequent Home Automation HAT).
  digital:
    hat_stack_level: 0
    sail_switch:
      opto_channel: 1
      active_high: true   # airflow present => contact closed => active
    # Future (Phase 6) — thermostat call signals via 24 VAC pilot relays:
    # call_heat: { opto_channel: 2 }
    # call_cool: { opto_channel: 3 }
    # fan:       { opto_channel: 4 }

thresholds:
  delta_t:
    cooling_min_f: 15     # expected cooling ΔT band (return - supply)
    cooling_max_f: 22
    heating_min_f: 25     # expected heating ΔT band
    heating_max_f: 70
  filter_dp:
    high_inh2o: 1.0       # alert above this differential pressure (change filter)

mqtt:
  host: "192.168.1.10"
  port: 1883
  username: ""
  password: ""
  base_topic: "ac_monitor"
  discovery_prefix: "homeassistant"
  retain: true

web:
  host: "0.0.0.0"
  port: 8000
