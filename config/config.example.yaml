# AC Monitor — example configuration
# Copy to config.yaml and fill in the real thermistor calibration and MQTT credentials.
# This file documents the intended config schema; the loader/validator is Phase 2.

units:
  temperature: F          # C or F

poll:
  interval_s: 5           # how often to read all sensors
  fan_debounce_s: 5       # OPTO-5 sail switch: ignore flutter shorter than this (seconds)

sensors:
  # 10K NTC thermistors (DROK B3950) on HAT analog inputs AD1-AD4. Each thermistor wires
  # ADx -> that connector's GND (pin 1); the HAT's internal 15k pull-up to 3.3V forms the
  # divider. Read raw volts via SMioplus/ioplus adcrd, then convert in software:
  #   R = r_pullup * V / (vref - V)
  #   1/T(K) = 1/298.15 + (1/beta) * ln(R / r_nominal)
  #   true_C = gain * (T - 273.15) + offset      # two-point ice/boiling field calibration
  # See docs/calibration.md for the derivation and measured values.
  thermistors:
    hat_stack_level: 0
    beta: 3950              # DROK B3950
    r_nominal: 10000        # ohms at 25 C
    r_pullup: 15000         # HAT internal analog-input pull-up
    vref: 3.3               # pull-up rail (measured ~3.31)
    calibration:            # true_C = gain * reading_C + offset (from ice + Tyler-TX boil)
      gain: 1.024
      offset: -1.20
    # AD channel (1-8) -> role. Wiring per docs/hardware.md.
    channels:
      output_air:   1       # AD1  (supply air leaving the coil)
      input_air:    2       # AD2  (return air entering the coil)
      suction_line: 3       # AD3  (refrigerant suction line)
      liquid_line:  4       # AD4  (refrigerant liquid line)
    # Headline metric: air-side ΔT = input_air - output_air (AD2 - AD1).

  # HAT opto-isolated digital inputs (Sequent Home Automation HAT).
  digital:
    hat_stack_level: 0
    fan:
      opto_channel: 5       # OPTO-5: airflow-proof sail switch (fan running vs idle)
      active_high: true     # fan running => airflow => contact closed => active
    # Future (Phase 6) — thermostat call signals via 24 VAC pilot relays:
    # call_heat: { opto_channel: 2 }
    # call_cool: { opto_channel: 3 }

thresholds:
  delta_t:
    cooling_min_f: 15     # expected cooling ΔT band (return - supply)
    cooling_max_f: 22
    heating_min_f: 25     # expected heating ΔT band
    heating_max_f: 70

# Split-flap display push (toggle + target set from the web control panel).
display:
  enabled: true             # push readings to the split-flap (on by default)
  base_url: "http://192.168.0.17:8080"
  slot: 2                   # POST /api/screens/<slot>
  refresh_s: 30

# MQTT / Home Assistant. Broker host/port/credentials are normally entered in the
# web control panel and persisted here; `enabled` toggles publishing at runtime.
mqtt:
  enabled: false
  host: "192.168.1.10"
  port: 1883
  username: ""
  password: ""
  base_topic: "ac_monitor"
  discovery_prefix: "homeassistant"
  retain: true

web:
  host: "0.0.0.0"
  port: 8000

# Sequent HAT hardware watchdog. If enabled, the app pets it every poll; if the
# app or Pi hangs, the HAT power-cycles the Pi (recovery for an unattended
# appliance). Off by default — enable after verifying it recovers the I2C
# lockup on your hardware (docs/i2c-lockup.md).
watchdog:
  enabled: false
  period_s: 120
